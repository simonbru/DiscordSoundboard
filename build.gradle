plugins {
    id 'java'
    id 'idea'
    id 'distribution'
    id 'org.springframework.boot' version '4.2.0'
    id 'application'
}

repositories {
    mavenCentral()
    maven {
        url = 'https://jitpack.io'  // For com.github.walkyst.JAADec-fork:jaadec-ext-aac & ibxm-fork:com.github.walkyst:ibxm-fork
    }
    maven {
        url = "https://maven.lavalink.dev/releases"  // For moe.kyokobot.libdave:*
    }
}

processResources {
    def expandProps = [projectVersion: projectVersion]
    inputs.properties(expandProps)
    filesMatching('application.yml') {
        expand(expandProps)
    }
}

test {
    useJUnitPlatform()
}

application {
    mainClass = 'net.dirtydeeds.discordsoundboard.MainController'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named("bootJar") {
    manifest {
        attributes 'Implementation-Title': rootProject.name,
                'Implementation-Version': projectVersion
    }
}

dependencies {
    // Spring Boot BOM: aligns Spring, Hibernate, H2, logback, Lombok, JUnit and Mockito versions
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)

    implementation 'net.dv8tion:JDA:6.7.0'
    implementation 'moe.kyokobot.libdave:adapter-jda:0.2.0'
    implementation 'moe.kyokobot.libdave:impl-jni:0.2.0'
    implementation 'moe.kyokobot.libdave:natives-linux-x86-64:0.2.0'
    implementation 'dev.arbjerg:lavaplayer:2.2.7'

    implementation 'commons-io:commons-io:2.22.0'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-rest'
    runtimeOnly 'com.h2database:h2'

    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.1'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core'
    testImplementation 'org.mockito:mockito-junit-jupiter'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

processResources {
    exclude 'app.properties'
}

bootJar {
    exclude ("application.properties")
}

//Run tasks -> distributions -> assembleBootDist to create a release zip
bootDistZip {
    archiveFileName = 'DiscordSoundboard.zip'
    into ("DiscordSoundboard/bin") {
        from ('src/main/resources/application.properties.example')
        from ("${layout.buildDirectory.get().asFile}/resources/main/application.yml")
    }
    into("DiscordSoundboard/bin/static") {
        from('src/main/webapp')
    }
    into("DiscordSoundboard/bin/sounds") {
        from('sounds')
    }
    rename { String fileName ->
        fileName.replace('application.properties.example', 'application.properties') }
}

def renameDist = tasks.register('renameDist') {
    doLast {
        new File("${layout.buildDirectory.get().asFile}/distributions/DiscordSoundboard.zip")
            .renameTo("${layout.buildDirectory.get().asFile}/distributions/DiscordSoundboard-"+projectVersion+".zip")
    }
}

tasks.named('bootDistZip') { finalizedBy renameDist }

// One-off migration of a database written by H2 1.4.200 (used up to v3.3.x / Spring Boot 2.7) to the H2 2.x format.
// Stop the bot first, then: ./gradlew migrateH2Database [-PdbPath=discordDB/discordDB] [-PdbUser=admin] [-PdbPassword=password]
// The old file is kept as <db>.mv.db.h2-1.4.bak and the intermediate SQL dump as <db>-h2-1.4.sql.
configurations {
    h2Legacy
}

dependencies {
    h2Legacy 'com.h2database:h2:1.4.200'
}

def h2DbPath = providers.gradleProperty('dbPath').orElse('discordDB/discordDB').map { file(it).absolutePath }
def h2DbUser = providers.gradleProperty('dbUser').orElse('admin')
def h2DbPassword = providers.gradleProperty('dbPassword').orElse('password')
def h2DumpPath = h2DbPath.map { it + '-h2-1.4.sql' }

def exportLegacyH2Database = tasks.register('exportLegacyH2Database', JavaExec) {
    group = 'database'
    description = 'Dumps an H2 1.4.200 database to SQL (first step of migrateH2Database).'
    classpath = configurations.h2Legacy
    mainClass = 'org.h2.tools.Script'
    argumentProviders.add({
        ['-url', "jdbc:h2:file:${h2DbPath.get()};IFEXISTS=TRUE", '-user', h2DbUser.get(), '-password', h2DbPassword.get(),
         '-script', h2DumpPath.get()]
    } as CommandLineArgumentProvider)
    doFirst {
        if (!new File(h2DbPath.get() + '.mv.db').exists()) {
            throw new GradleException("No database found at ${h2DbPath.get()}.mv.db")
        }
        if (new File(h2DbPath.get() + '.mv.db.h2-1.4.bak').exists()) {
            throw new GradleException("${h2DbPath.get()}.mv.db.h2-1.4.bak already exists: the database looks already migrated")
        }
    }
}

tasks.register('migrateH2Database', JavaExec) {
    group = 'database'
    description = 'Migrates an H2 1.4.200 database file to the H2 2.x format used by the application.'
    dependsOn exportLegacyH2Database
    classpath = configurations.runtimeClasspath
    mainClass = 'org.h2.tools.RunScript'
    argumentProviders.add({
        ['-url', "jdbc:h2:file:${h2DbPath.get()}", '-user', h2DbUser.get(), '-password', h2DbPassword.get(),
         '-script', h2DumpPath.get(), '-options', 'FROM_1X']
    } as CommandLineArgumentProvider)
    doFirst {
        def dbFile = new File(h2DbPath.get() + '.mv.db')
        if (!dbFile.renameTo(new File(dbFile.path + '.h2-1.4.bak'))) {
            throw new GradleException("Could not back up $dbFile")
        }
    }
}
